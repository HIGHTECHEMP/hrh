<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1"
>

<title>
Student Registration | Holy Rosary
</title>

<link
rel="stylesheet"
href="css/styles.css"
>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="js/config.js"></script>

</head>


<body class="auth-page">

<main class="auth-shell">

<a
class="brand"
href="index.html"
>

<span class="brand-mark">
HR
</span>

<span>
<b>Holy Rosary</b>

<small>
Student Registration
</small>

</span>

</a>


<section class="auth-card">

<span class="eyebrow">
STUDENT PORTAL
</span>

<h1>
Create your account.
</h1>

<p>
Enter the registration code supplied by Registry.
</p>


<form id="register-form">


<label>
Registration Code

<input
id="registration-code"
type="text"
required
autocomplete="off"
placeholder="Enter your registration code"
>

</label>


<label>
Full name

<input
id="full-name"
type="text"
required
autocomplete="name"
>

</label>


<label>
Email address

<input
id="email"
type="email"
required
autocomplete="email"
>

</label>


<label>
Password

<input
id="password"
type="password"
required
minlength="8"
autocomplete="new-password"
>

</label>


<label>
Confirm password

<input
id="confirm-password"
type="password"
required
minlength="8"
autocomplete="new-password"
>

</label>


<button
class="btn primary full"
type="submit"
>

Create Student Account

</button>


<p
id="register-message"
class="form-message"
></p>

</form>


<div
style="
margin-top:22px;
text-align:center;
"
>

Already have an account?

<a href="login.html">
Login
</a>

</div>

</section>

</main>


<script>

document
.getElementById("register-form")
.addEventListener(
"submit",
async e => {

e.preventDefault();

const message =
document.getElementById(
"register-message"
);

const password =
document.getElementById(
"password"
).value;

const confirmPassword =
document.getElementById(
"confirm-password"
).value;


if (
password !== confirmPassword
) {

message.textContent =
"Passwords do not match.";

return;

}


message.textContent =
"Creating your account…";


try {

const response =
await fetch(
`${HR_CONFIG.SUPABASE_URL}/functions/v1/student-register`,
{

method: "POST",

headers: {

"Content-Type":
"application/json",

"apikey":
HR_CONFIG.SUPABASE_ANON_KEY

},

body: JSON.stringify({

registration_code:
document
.getElementById(
"registration-code"
)
.value
.trim(),

full_name:
document
.getElementById(
"full-name"
)
.value
.trim(),

email:
document
.getElementById(
"email"
)
.value
.trim()
.toLowerCase(),

password

})

});


const data =
await response.json();


if (!response.ok) {

throw new Error(
data.error ||
"Registration failed."
);

}


message.textContent =
data.message ||
"Account created successfully.";


setTimeout(
() => {

location.href =
"login.html";

},
1500
);


} catch(error) {

message.textContent =
error.message;

}

});

</script>

</body>
</html>
