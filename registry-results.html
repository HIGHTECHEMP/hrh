<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registry Results | Holy Rosary</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
</head>

<body data-role="registry" data-roles="registry,admin">
    <aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">HR</span><span><b>Holy
                    Rosary</b><small>REGISTRY PORTAL</small></span></a>
        <nav class="side-nav"><a href="registry-dashboard.html">Overview</a><a
                href="registry-students.html">Students</a><a class="active" href="registry-results.html">Results</a><a
                href="registry-pins.html">Result PINs</a><a href="registry-applications.html">Applications</a></nav>
        <button id="logout" class="btn ghost full">Sign out</button>
    </aside>
    <main class="dashboard">
        <div class="dash-top">
            <div><span class="eyebrow">REGISTRY PORTAL</span>
                <h1>Result review & publication</h1>
                <p id="welcome" class="lead">Loading secure workspace…</p>
            </div><span id="chip" class="badge">Protected</span>
        </div>
        <section class="dash-card">
            <div class="registry-toolbar"><label>Status<select id="status-filter">
                        <option value="submitted">Submitted</option>
                        <option value="approved">Approved</option>
                        <option value="returned">Returned</option>
                        <option value="published">Published</option>
                        <option value="ALL">All</option>
                    </select></label><label>Search<input id="result-search"
                        placeholder="Name, exam number or course"></label><button id="refresh-results" class="btn ghost"
                    type="button">Refresh</button></div>
            <p id="registry-result-message" class="form-message" aria-live="polite"></p>
            <div id="registry-results-list" class="registry-results-list">
                <div class="admin-loading">Loading results…</div>
            </div>
        </section>
    </main>
    <script src="js/portal.js"></script>
    <script src="js/registry-results.js"></script>
</body>

</html>
