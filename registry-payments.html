<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Payments | Holy Rosary</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
</head>

<body data-role="registry" data-roles="registry,admin">
    <aside class="sidebar"><a class="brand" href="index.html"><span class="brand-mark">HR</span><span><b>Holy
                    Rosary</b><small>REGISTRY PORTAL</small></span></a>
        <nav class="side-nav"><a href="registry-dashboard.html">Overview</a><a
                href="registry-students.html">Students</a><a href="registry-results.html">Results</a><a
                href="registry-pins.html">Result PINs</a><a href="registry-applications.html">Applications</a><a
                class="active" href="registry-payments.html">Payments</a></nav><button id="logout"
            class="btn ghost full">Sign out</button>
    </aside>
    <main class="dashboard">
        <div class="dash-top">
            <div><span class="eyebrow">REGISTRY PORTAL</span>
                <h1>Result PIN fulfilment</h1>
                <p id="welcome" class="lead">Loading secure workspace…</p>
            </div><span class="badge">Protected</span>
        </div>
        <section class="dash-card">
            <div class="registry-toolbar"><label>Status<select id="payment-status-filter">
                        <option value="successful">Successful PIN payments</option>
                        <option value="pending">Pending</option>
                        <option value="failed">Failed</option>
                        <option value="ALL">All</option>
                    </select></label><label>Search<input id="payment-search"
                        placeholder="Receipt, transaction, email or PIN payment"></label><button id="refresh-payments"
                    class="btn ghost" type="button">Refresh</button></div>
            <p id="registry-payment-message" class="form-message"></p>
            <div id="registry-payment-list" class="payment-history">
                <div class="admin-loading">Loading payments…</div>
            </div>
        </section>
    </main>
    <script src="js/portal.js"></script>
    <script src="js/registry-payments.js"></script>
</body>

</html>
