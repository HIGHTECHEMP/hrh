<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment | Holy Rosary</title><link rel="stylesheet" href="css/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script></head><body class="auth-page"><main class="pay-box"><a class="brand" href="index.html"><span class="brand-mark">HR</span><span><b>Holy Rosary</b><small>Secure Payment</small></span></a><section class="auth-card"><span class="eyebrow">FLUTTERWAVE</span><h1>Complete your payment.</h1><p id="purpose" class="lead"></p><label>Amount (NGN)<input id="amount" type="number" min="1" required></label><button id="pay" class="btn primary full" style="margin-top:16px">Pay securely</button><p id="msg" class="form-message"></p><p class="muted">The Flutterwave secret key stays on the server. This page only requests a secure hosted checkout.</p></section></main><script>const q=new URLSearchParams(location.search);const purpose=q.get("purpose")||"application";const ref=q.get("reference")||("HR-"+Date.now());const email=q.get("email")||"";document.getElementById("purpose").textContent=`Payment for ${purpose.replaceAll("_"," ")} · Reference ${ref}`;document.getElementById("pay").onclick=async()=>{const msg=document.getElementById("msg"),amount=Number(document.getElementById("amount").value);if(!amount){msg.textContent="Enter the approved amount.";return}if(!hrSupabase){msg.textContent="Configure Supabase first.";return}msg.textContent="Opening secure checkout…";const {data,error}=await hrSupabase.functions.invoke("create-checkout",{body:{purpose,reference:ref,email,amount,currency:"NGN"}});if(error){msg.textContent=error.message;return}if(data?.link) location.href=data.link; else msg.textContent=data?.error||"Unable to create checkout.";};</script></body></html>
