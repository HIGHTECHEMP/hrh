<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Application Payment | Holy Rosary</title>
<link rel="stylesheet" href="css/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
</head>
<body class="auth-page">
<main class="pay-box">
  <a class="brand" href="index.html"><span class="brand-mark">HR</span><span><b>Holy Rosary</b><small>Admissions Payment</small></span></a>
  <section class="auth-card">
    <span class="eyebrow">APPLICATION PAYMENT</span>
    <h1 id="title">Checking your payment…</h1>
    <p id="detail" class="lead">Please wait while we load your verified application payment record.</p>
    <div id="receipt" class="receipt-summary" hidden></div>
    <a class="btn primary full" href="apply.html" style="margin-top:18px">Return to admissions</a>
  </section>
</main>
<script>
document.addEventListener("DOMContentLoaded", async () => {
  const tx = new URLSearchParams(location.search).get("tx_ref");
  const title = document.getElementById("title");
  const detail = document.getElementById("detail");
  const receipt = document.getElementById("receipt");

  if (!tx) {
    title.textContent = "Payment reference missing";
    detail.textContent = "Return to admissions and try again.";
    return;
  }

  const { data, error } = await hrSupabase.functions.invoke("application-payment-status", {
    body: { tx_ref: tx }
  });

  if (error || !data?.payment) {
    title.textContent = "Payment status unavailable";
    detail.textContent = error?.message || data?.error || "We could not load the payment yet.";
    return;
  }

  const p = data.payment;
  const successful = String(p.status || "").toLowerCase() === "successful";
  title.textContent = successful ? "Application payment successful" : `Application payment ${p.status || "pending"}`;
  detail.textContent = successful
    ? "Your official application payment has been verified. Keep this receipt/reference for your admission records."
    : "The application payment has not yet been confirmed as successful.";

  receipt.hidden = false;
  receipt.innerHTML = `
    <b>Receipt</b><span>${p.receipt_no || "Pending"}</span>
    <b>Application</b><span>${p.metadata?.application_no || p.application_id || "—"}</span>
    <b>Amount</b><span>₦${Number(p.amount || 0).toLocaleString()}</span>
    <b>Transaction</b><span>${p.tx_ref || tx}</span>
  `;
});
</script>
</body>
</html>
